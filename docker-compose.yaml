services:
  portfolio:
    container_name: portfolio
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      pull: true
    image: portfolio:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-http-rtr.entrypoints=web"
      - "traefik.http.routers.portfolio-http-rtr.rule=Host(`alix-jdlm.fr`) || Host(`www.alix-jdlm.fr`)"
      - "traefik.http.routers.portfolio-http-rtr.service=portfolio-svc"
      - "traefik.http.services.portfolio-svc.loadbalancer.server.port=8080"
